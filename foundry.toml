[profile.default]
src = 'contracts'
test = 'test'
script = 'script'
out = 'out'
libs = ['lib', 'node_modules']
cache_path = 'cache_forge'
solc = '0.8.24'
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = [
    'forge-std/=lib/forge-std/src/',
    '@openzeppelin/=node_modules/@openzeppelin/',
]

[fuzz]
runs = 256
